<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>maodou-hmlwsim</title>
  <link rel="stylesheet" href="css/simulator.css">
  <link rel="stylesheet" href="css/mobile.css">
  <!-- 离线依赖：网页版从 CDN 异步加载，移动端改为本地同步加载，避免联网与竞态 -->
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/qrcode.js"></script>
</head>

<body>
  <div id="app">
    <!--
      左侧控制面板在移动端由原生 M3E 页面接管，但 DOM 必须保留：
      SensorPanel / App 直接按 id 绑定事件，原生端通过派发同样的事件驱动它们，
      从而 100% 保留网页版的全部可配置项与交互行为。
    -->
    <div id="controls">
      <h2>Device</h2>
      <div class="control-group">
        <label>Screen Shape</label>
        <select id="shape-select">
          <option value="circle">Circle</option>
          <option value="rect">Rectangle</option>
        </select>
      </div>
      <div class="control-group">
        <label>Resolution</label>
        <div class="row">
          <input type="number" id="width-input" value="466" min="100" max="1000">
          <span>×</span>
          <input type="number" id="height-input" value="466" min="100" max="1000">
        </div>
      </div>
      <div class="control-group">
        <label>Presets</label>
        <div style="display:flex;flex-wrap:wrap;gap:0.25rem;">
          <button class="preset-btn" data-preset="fit2">FIT2</button>
          <button class="preset-btn" data-preset="gt3">GT3+</button>
          <button class="preset-btn" data-preset="fit3">FIT3+</button>
          <button class="preset-btn" data-preset="gt2-42">GT2 (42mm)</button>
          <button class="preset-btn" data-preset="gt2-46">GT2 (46mm)</button>
          <button class="preset-btn" data-preset="watchd">WATCH D</button>
        </div>
      </div>

      <h2>Sensors</h2>
      <div class="control-group">
        <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;">
          <span>Use system battery</span>
          <input type="checkbox" id="use-system-battery" checked style="width:1.25rem;height:1.25rem;cursor:pointer;">
        </label>
        <label style="margin-top:0.5rem;">Battery <span id="battery-value">85%</span></label>
        <input type="range" id="battery-slider" min="0" max="100" value="85" disabled>
      </div>
      <div class="control-group sensor-controls">
        <label>Linear acceleration</label>
        <label class="sensor-toggle"><span>Show real values</span><input type="checkbox" id="sensor-accelerometer" checked></label>
      </div>
      <div class="control-group sensor-controls">
        <label>Rotation rate</label>
        <label class="sensor-toggle"><span>Show real values</span><input type="checkbox" id="sensor-gyroscope" checked></label>
      </div>
      <div class="control-group sensor-controls">
        <label>Magnetic field</label>
        <label class="sensor-toggle"><span>Show real values</span><input type="checkbox" id="sensor-compass" checked></label>
      </div>
      <div class="control-group sensor-controls">
        <label>Barometer</label>
        <label class="sensor-toggle"><span>Show real values</span><input type="checkbox" id="sensor-barometer"></label>
      </div>
      <div class="control-group sensor-controls">
        <label>Step count <span id="sensor-step-value">0</span></label>
        <input type="number" id="sensor-step-count" min="0" max="999999" value="0">
      </div>
      <div class="control-group sensor-controls">
        <label>Heart rate <span id="sensor-heart-rate-value">255</span></label>
        <label class="sensor-toggle"><span>Not detected</span><input type="checkbox" id="sensor-heart-rate-invalid" checked></label>
        <input type="range" id="sensor-heart-rate" min="30" max="220" value="72" disabled>
      </div>
      <div class="control-group sensor-controls">
        <label class="sensor-toggle"><span>Wearing state</span><input type="checkbox" id="sensor-on-body"></label>
      </div>

      <h2>WearEngine</h2>
      <div class="control-group" id="wearengine-panel">
        <label>Simulate phone messages</label>
        <div class="msg-log" id="we-log"></div>
        <div class="input-row">
          <input type="text" id="we-input" placeholder="Type a message...">
          <button id="we-send-btn">Send</button>
        </div>
      </div>

      <h2>Crown</h2>
      <div class="control-group">
        <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;">
          <span>Invert Scroll</span>
          <input type="checkbox" id="invert-scroll-toggle" style="width:1.25rem;height:1.25rem;cursor:pointer;">
        </label>
        <div style="font-size:0.8125rem;color:#86868b;margin-top:0.25rem;">切换鼠标滚轮滚动触发的滚动事件方向</div>
      </div>

      <h2>Tools</h2>
      <button id="screenshot-save-btn" class="action-btn">截图并下载</button>
      <button id="screenshot-clipboard-btn" class="action-btn">截图并复制到剪贴板</button>

      <h2>Log</h2>
      <div id="log-panel"></div>

      <button id="restart-btn" class="action-btn">Restart app</button>
      <button id="reset-btn" class="danger-btn">Reload app</button>
    </div>

    <!-- Center: watch viewport -->
    <div id="watch-area">
      <div id="status-bar">
        <span id="app-info"></span>
      </div>

      <div id="watch-shell">
        <div id="watch-frame" class="circle">
          <div id="watch-content"></div>
          <div id="lib-loading-overlay">
            <div id="lib-loading-text">Loading libraries...</div>
          </div>
        </div>
        <div id="crown"></div>
      </div>

      <div id="drop-zone">
        <input type="file" id="file-input" style="display:none;">
        <div id="drop-hint">Load .app / Drag &amp; drop here</div>
      </div>
    </div>
  </div>

  <!-- Core modules（与上游仓库完全一致的加载顺序） -->
  <script src="js/unpacker.js"></script>
  <script src="js/css-adapter.js"></script>

  <!-- Device Features -->
  <script src="js/runtime/deviceFeature_virtualFS.js"></script>
  <script src="js/runtime/deviceFeature_display.js"></script>
  <script src="js/runtime/deviceFeature_battery.js"></script>
  <script src="js/runtime/deviceFeature_vibrator.js"></script>
  <script src="js/runtime/deviceFeature_sensor.js"></script>
  <script src="js/runtime/deviceFeature_network.js"></script>
  <script src="js/runtime/deviceFeature_phoneLink.js"></script>
  <script src="js/runtime/deviceFeature_pageNav.js"></script>
  <script src="js/runtime/deviceFeature_appLifecycle.js"></script>
  <script src="js/runtime/deviceFeature_crown.js"></script>
  <script src="js/runtime/deviceFeature_touch.js"></script>

  <!-- API Simulations -->
  <script src="js/runtime/apiSim_file.js"></script>
  <script src="js/runtime/apiSim_storage.js"></script>
  <script src="js/runtime/apiSim_router.js"></script>
  <script src="js/runtime/apiSim_battery.js"></script>
  <script src="js/runtime/apiSim_device.js"></script>
  <script src="js/runtime/apiSim_brightness.js"></script>
  <script src="js/runtime/apiSim_vibrator.js"></script>
  <script src="js/runtime/apiSim_sensor_accelerometer.js"></script>
  <script src="js/runtime/apiSim_sensor_gyroscope.js"></script>
  <script src="js/runtime/apiSim_sensor_compass.js"></script>
  <script src="js/runtime/apiSim_sensor_stepCounter.js"></script>
  <script src="js/runtime/apiSim_sensor_barometer.js"></script>
  <script src="js/runtime/apiSim_sensor_heartRate.js"></script>
  <script src="js/runtime/apiSim_sensor_onBodyState.js"></script>
  <script src="js/runtime/apiSim_sensor.js"></script>
  <script src="js/runtime/apiSim_fetch.js"></script>
  <script src="js/runtime/apiSim_wearengine.js"></script>
  <script src="js/runtime/apiSim_app.js"></script>

  <!-- API Registry -->
  <script src="js/runtime/api-registry.js"></script>

  <!-- Component Views -->
  <script src="js/runtime/componentView.js"></script>
  <script src="js/runtime/componentView_progress.js"></script>
  <script src="js/runtime/componentView_qrcode.js"></script>
  <script src="js/runtime/componentView_chart.js"></script>

  <!-- Runtime -->
  <script src="js/runtime/sandbox.js"></script>

  <!-- UI -->
  <script src="js/sensor-panel.js"></script>

  <!-- Main app -->
  <script src="js/app.js"></script>

  <!-- Mobile adapter（上游源码之上的适配层，不改解释执行语义） -->
  <script src="js/mobile/mobile-unpacker.js"></script>
  <script src="js/mobile/mobile-audio.js"></script>
  <script src="js/mobile/mobile-bridge.js"></script>
</body>

</html>
