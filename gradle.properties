# Gradle 8.14.6 只支持 Java 1.8–24；本机默认 JDK 25 会直接报
# "Incompatible Gradle JVM version"。这里强制 Gradle daemon / AS Sync 使用 JDK 21。
# .idea/gradle.xml 的 gradleJvm=#GRADLE_LOCAL_JAVA_HOME 会读取本项。
# 换机器或 JDK 路径变化时，只需改这一行。
org.gradle.java.home=E:/Android/jdk21
# 让 Android Studio 在 Gradle JDK 下拉里能发现这个 JDK（IDE 用它编译 build.gradle.kts）
org.gradle.java.installations.paths=E:/Android/jdk21

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
